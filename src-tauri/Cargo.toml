[package]
name = "link-mage"
version = "0.1.0"
description = "Backend for Link Mage OSINT tool"
authors = ["Link Mage Contributors"]
license = "MIT"
repository = "https://github.com/your-username/link-mage"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
tauri = { version = "2.9.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["time"] }
libloading = "0.8"
# System keychain (macOS Keychain, Linux Secret Service, Windows Credential Manager)
keyring = "3"
# HTTP client — blocking feature used by transforms; json for easy response parsing
reqwest = { version = "0.13", features = ["blocking", "json"] }

# ── Transforms ────────────────────────────────────────────────────────────────
# DNS A/AAAA resolution via the system resolver (default features include tokio + system-config)
hickory-resolver = { version = "0.25" }
# WHOIS queries
whois-rust = "1.6"
# MaxMind GeoLite2 / GeoIP2 database reader
maxminddb = "0.27"
quick-xml = "0.39"
scraper = "0.26.0"
# Date/time handling for provenance tracking
chrono = { version = "0.4", features = ["serde"] }
